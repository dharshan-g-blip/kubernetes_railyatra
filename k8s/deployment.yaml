apiVersion: apps/v1
kind: Deployment
metadata:
  name: railyatra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: railyatra
  template:
    metadata:
      labels:
        app: railyatra
    spec:
      containers:
        - name: railyatra
          # Built locally by Jenkins. Docker Desktop Kubernetes (kubeadm mode)
          # shares Docker's image store, so no Docker Hub is needed.
          image: railyatra-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: railyatra-service
spec:
  type: NodePort
  selector:
    app: railyatra
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
